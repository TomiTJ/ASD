spring.application.name=AdminBankApp

# SQLite Connection (To be Removed)
#spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
#spring.datasource.url=jdbc:sqlite:database.db
#spring.datasource.driver-class-name=org.sqlite.JDBC

#PostgreSQL connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankdatabase}
spring.datasource.username=${DB_USERNAME:bankadmin}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

#run data.sql file on startup.
spring.sql.init.mode=always

#hot reload
spring.thymeleaf.cache=false

spring.jpa.hibernate.ddl-auto=update
server.servlet.session.tracking-modes=cookie
