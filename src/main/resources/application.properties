spring.application.name=AdminBankApp

# Database Configuration (uses environment variables for Azure)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bankdatabase}
spring.datasource.username=${DB_USERNAME:bankadmin}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

#run data.sql file on startup (disable in production)
spring.sql.init.mode=${SQL_INIT_MODE:always}

#hot reload (disable in production)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

spring.jpa.hibernate.ddl-auto=update
server.servlet.session.tracking-modes=cookie

# Server configuration for Azure
server.port=${PORT:8080}

# Production settings
spring.jpa.show-sql=false
logging.level.root=INFO
