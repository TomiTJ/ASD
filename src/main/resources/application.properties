
spring.application.name=AdminBankApp

# SQLite Connection (To be Removed)
#spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
#spring.datasource.url=jdbc:sqlite:database.db
#spring.datasource.driver-class-name=org.sqlite.JDBC


spring.datasource.url=jdbc:postgresql://localhost:5432/bankdb2
spring.datasource.username=bankuser
spring.datasource.password=bankpass
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate create fresh schema for now
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=always


# Hibernate dialect for Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.defer-datasource-initialization=true

#hot reload
spring.thymeleaf.cache=false

server.servlet.session.tracking-modes=cookie

