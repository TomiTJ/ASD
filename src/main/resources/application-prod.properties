# Production overrides — applied when SPRING_PROFILES_ACTIVE=prod (set in ECS/Docker)

# Run data.sql on startup to create tables and seed data
spring.sql.init.mode=always

# Let Hibernate create/update tables from entity definitions
spring.jpa.hibernate.ddl-auto=update

# Enable Thymeleaf caching for performance
spring.thymeleaf.cache=true
