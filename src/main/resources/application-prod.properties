# Production overrides — applied when SPRING_PROFILES_ACTIVE=prod (set in ECS/Docker)

# Tables already exist in RDS — do NOT run data.sql (it drops all tables and wipes data)
spring.sql.init.mode=never

# Let Hibernate update schema if entities change, but never drop tables
spring.jpa.hibernate.ddl-auto=update

# Enable Thymeleaf caching for performance
spring.thymeleaf.cache=true
