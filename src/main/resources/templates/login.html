<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Bank Admin — Login</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 3rem auto; }
        h2 { margin-bottom: 1rem; }
        label { font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; border: 1px solid #333; border-radius: 6px; background: #f5f5f5; cursor: pointer; }
        #msg { margin-top: 1rem; color: red; }
    </style>

</head>
<body>
<h2>Bank Admin — Login</h2>

<form method="post" action="/login">
    <label>Email</label><br>
    <input type="text" name="email" required autocomplete="username"><br>

    <label>Password</label><br>
    <input type="password" name="password" required autocomplete="current-password"><br>

    <button type="submit">Sign in</button>
</form>

<p id="msg"></p>
<script>
    const p = new URLSearchParams(location.search);
    const map = {
        badcreds: 'Invalid email or password.',
        notfound: 'User not found.',
        inactive: 'Account is deactivated.',
    };
    if (p.has('logout')) document.getElementById('msg').textContent = 'Logged out.';
    if (p.get('error')) document.getElementById('msg').textContent = map[p.get('error')] || 'Login error.';
</script>
</body>
</html>
