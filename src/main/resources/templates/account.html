<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Accounts</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/accounts.css}">
</head>
<body>
<div class="main-layout">
    <div class="top-bar">
        <div class="name-card">
            <div th:text="${userName}"></div>
            <div class="position" th:text="${userRole}"></div>
        </div>
        <div class="img-placeholder"></div>
    </div>

    <div th:replace="fragments/navbar2 :: navbar2"></div>

    <div class="main-content-container">
        <div th:if="${msg}" class="msg" th:text="${msg}"></div>

        <div class="header-row">
            <h2>Accounts</h2>
            <div class="header-actions">
                <form class="filter" th:action="@{/accounts}" method="get">
                    <label>
                        <span>Search</span>
                        <input name="q" th:value="${param.q}" placeholder="Name or Account #">
                    </label>
                    <button class="btn" type="submit">Go</button>
                </form>
                <a class="btn" th:href="@{/accounts/create}">+ Create Account</a>
            </div>
        </div>

        <table class="data-table">
            <thead>
            <tr>
                <th style="width:70px">ID</th>
                <th style="width:150px">Account #</th>
                <th>Customer</th>
                <th>Email</th>
                <th style="width:120px">Type</th>
                <th style="width:110px">Status</th>
                <th style="width:130px">Balance (AUD)</th>
                <th style="width:260px">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="a : ${accounts}" th:classappend="${a.accountStatus.name() == 'FROZEN'} ? 'highlight'">
                <td th:text="${a.id}">1</td>
                <td th:text="${a.accountNumber}">0000000000</td>
                <td th:text="${a.customerName}">Example Name</td>
                <td th:text="${a.customerEmail}">example@email.com</td>
                <td th:text="${a.accountType}">SAVINGS</td>
                <td th:text="${a.accountStatus}">OPEN</td>
                <td th:text="${#numbers.formatDecimal(a.balance, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                <td class="actions-cell">
                    <a class="btn" th:href="@{/accounts/edit/{id}(id=${a.id})}">Edit</a>

                    <form th:action="@{/accounts/freeze/{id}(id=${a.id})}" method="post" class="inline-form"
                          onsubmit="return confirm('Freeze this account?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn" type="submit"
                                th:disabled="${a.accountStatus.name() == 'CLOSED' || a.accountStatus.name() == 'FROZEN'}">Freeze</button>
                    </form>

                    <form th:action="@{/accounts/close/{id}(id=${a.id})}" method="post" class="inline-form"
                          onsubmit="return confirm('Close this account?');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn warn" type="submit" th:disabled="${a.accountStatus.name() == 'CLOSED'}">Close</button>
                    </form>

                    <form th:action="@{/accounts/delete/{id}(id=${a.id})}" method="post" class="inline-form"
                          onsubmit="return confirm('Delete this account? This cannot be undone.');">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn warn" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(accounts)}">
                <td colspan="8">No accounts found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="footer"></div>
</div>
</body>
</html>
