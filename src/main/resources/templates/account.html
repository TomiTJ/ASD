<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accounts — Bank Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/accounts.css}">
</head>
<body>
<div class="main-layout">
    <div class="top-bar">
        <span class="top-bar-title">Accounts</span>
        <div class="top-bar-right">
            <div class="name-card">
                <div th:text="${userName}"></div>
                <div class="position" th:text="${userRole}"></div>
            </div>
            <div class="user-avatar-circle" th:text="${#strings.substring(userName, 0, 2)}">AU</div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar2 :: navbar2}"></div>

    <div class="main-content-container">
        <div class="heading-container">
            <h4>Customer Account Management</h4>
            <div>
                <div th:if="${msg}" class="alert alert-info" th:text="${msg}"></div>
            </div>
        </div>

        <div class="search-filter-container">
            <h4>Search Accounts</h4>
            <form th:action="@{/account}" method="get">
                <div class="search-filter-items">
                    <div>
                        <input type="text"
                               id="search"
                               name="search"
                               th:value="${search}"
                               placeholder="Search by customer name or account number...">
                    </div>
                    <div>
                        <button class="btn-style" type="submit">Search</button>
                    </div>
                    <div>
                        <a th:href="@{/account}">
                            <button class="btn-style" type="button">Clear</button>
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <div class="transactions-container">
            <h4>Accounts List</h4>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Account #</th>
                    <th>Customer Name</th>
                    <th>Email</th>
                    <th>Type</th>
                    <th>Balance (AUD)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="account : ${accounts}">
                    <td th:text="${account.id}"></td>
                    <td th:text="${account.accountNumber}"></td>
                    <td th:text="${account.customerName}"></td>
                    <td th:text="${account.customerEmail}"></td>
                    <td th:text="${account.accountType}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(account.balance, 1, 2)}"></td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${account.accountStatus == T(com.asd.model.Account.AccountStatus).OPEN} ? 'status-open' :
                                               (${account.accountStatus == T(com.asd.model.Account.AccountStatus).FROZEN} ? 'status-frozen' : 'status-closed')"
                              th:text="${account.accountStatus}">
                        </span>
                    </td>
                    <td class="action-buttons">
                        <!-- View Details button (opens modal) -->
                        <button class="btn-action btn-view"
                                type="button"
                                th:onclick="'openAccountModal(' + ${account.id} + ')'">
                            View Details
                        </button>

                        <!-- Freeze button -->
                        <form th:if="${account.accountStatus == T(com.asd.model.Account.AccountStatus).OPEN}"
                              th:action="@{/account/freeze/{id}(id=${account.id})}"
                              method="post"
                              style="display:inline;"
                              onsubmit="return confirm('Freeze this account? The customer will not be able to make transactions.')">
                            <button class="btn-action btn-freeze" type="submit">Freeze</button>
                        </form>

                        <!-- Unfreeze button -->
                        <form th:if="${account.accountStatus == T(com.asd.model.Account.AccountStatus).FROZEN}"
                              th:action="@{/account/unfreeze/{id}(id=${account.id})}"
                              method="post"
                              style="display:inline;">
                            <button class="btn-action btn-unfreeze" type="submit">Unfreeze</button>
                        </form>

                        <!-- Close button -->
                        <form th:if="${account.accountStatus != T(com.asd.model.Account.AccountStatus).CLOSED}"
                              th:action="@{/account/close/{id}(id=${account.id})}"
                              method="post"
                              style="display:inline;"
                              onsubmit="return confirm('Close this account? This action cannot be undone.')">
                            <button class="btn-action btn-close" type="submit">Close</button>
                        </form>

                        <!-- Delete button -->
                        <form th:if="${userRole == 'ADMIN'}"
                              th:action="@{/account/delete/{id}(id=${account.id})}"
                              method="post"
                              style="display:inline;"
                              onsubmit="return confirm('Are you sure you want to delete this account?');">
                            <button class="btn-action btn-delete" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${accounts.isEmpty()}">
                    <td colspan="8" style="text-align:center; color: gray;">No accounts found</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="transactions-container" style="margin-top: 2rem;">
            <h4>Create New Account</h4>
            <form th:action="@{/account/create}" method="post" th:object="${newAccount}">
                <div class="create-account-form">
                    <div class="form-group">
                        <label for="customerId">Customer</label>
                        <select id="customerId" name="customerId" required>
                            <option value="">Select Customer...</option>
                            <option th:each="customer : ${customers}"
                                    th:value="${customer.id}"
                                    th:text="${customer.name + ' (' + customer.email + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="accountType">Account Type</label>
                        <select id="accountType" name="accountType" required>
                            <option value="">Select Type...</option>
                            <option value="TRANSACTIONAL">Transactional</option>
                            <option value="SAVINGS">Savings</option>
                            <option value="CREDIT">Credit</option>
                            <option value="BUSINESS">Business</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="balance">Initial Balance (AUD)</label>
                        <input type="number"
                               id="balance"
                               name="balance"
                               step="0.01"
                               value="0.00"
                               required>
                    </div>

                    <div class="form-group">
                        <button class="btn-style" type="submit">Create Account</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="footer"></div>
</div>

<!-- Account Details Modal -->
<div id="accountModal" class="modal-overlay">
    <div class="modal-container">
        <div class="modal-header">
            <h3>Account Details</h3>
            <button class="modal-close" onclick="closeAccountModal()">&times;</button>
        </div>

        <!-- Notification Banner -->
        <div id="modalNotification" class="modal-notification"></div>

        <div class="modal-body">
            <!-- Account Information Section -->
            <div class="modal-section">
                <h4>Account Information</h4>
                <form id="updateAccountForm">
                    <input type="hidden" id="modal-account-id">

                    <div class="form-grid">
                        <div class="form-group-modal">
                            <label>Account ID</label>
                            <input type="text" id="modal-account-id-display" readonly>
                        </div>
                        <div class="form-group-modal">
                            <label>Account Number</label>
                            <input type="text" id="modal-account-number" readonly>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group-modal">
                            <label>Primary Customer</label>
                            <input type="text" id="modal-primary-customer" readonly>
                        </div>
                        <div class="form-group-modal">
                            <label>Account Type</label>
                            <span id="modal-joint-indicator"></span>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group-modal">
                            <label for="modal-account-category">Account Category</label>
                            <select id="modal-account-category" required>
                                <option value="TRANSACTIONAL">Transactional</option>
                                <option value="SAVINGS">Savings</option>
                                <option value="CREDIT">Credit</option>
                                <option value="BUSINESS">Business</option>
                            </select>
                        </div>
                        <div class="form-group-modal">
                            <label for="modal-account-status">Account Status</label>
                            <select id="modal-account-status" required>
                                <option value="OPEN">Open</option>
                                <option value="FROZEN">Frozen</option>
                                <option value="CLOSED">Closed</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group-modal">
                            <label for="modal-balance">Balance (AUD)</label>
                            <input type="number" id="modal-balance" step="0.01" required>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Joint Account Management Section -->
            <div class="modal-section">
                <h4>Joint Account Customers</h4>
                <div id="joint-customers-container"></div>

                <div class="add-customer-section">
                    <select id="customer-to-link">
                        <option value="">Select customer to link...</option>
                    </select>
                    <button class="btn-small btn-link-customer" onclick="linkCustomer()">Link Customer</button>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-modal btn-modal-save" onclick="saveAccountChanges()">Save Changes</button>
            <button class="btn-modal btn-modal-close" onclick="closeAccountModal()">Close</button>
        </div>
    </div>
</div>

<script>
    let currentAccountId = null;

    function showModalNotification(message, type) {
        const notification = document.getElementById('modalNotification');
        notification.textContent = message;
        notification.className = 'modal-notification show ' + type;

        // Auto-hide after 3 seconds
        setTimeout(() => {
            notification.classList.remove('show');
        }, 3000);
    }

    function hideModalNotification() {
        const notification = document.getElementById('modalNotification');
        notification.classList.remove('show');
    }

    function openAccountModal(accountId) {
        currentAccountId = accountId;
        hideModalNotification();
        fetch('/account/api/detail/' + accountId)
            .then(response => response.json())
            .then(data => {
                populateModal(data);
                document.getElementById('accountModal').classList.add('active');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Failed to load account details');
            });
    }

    function closeAccountModal() {
        document.getElementById('accountModal').classList.remove('active');
        hideModalNotification();
        currentAccountId = null;
    }

    function populateModal(data) {
        document.getElementById('modal-account-id').value = data.id;
        document.getElementById('modal-account-id-display').value = data.id;
        document.getElementById('modal-account-number').value = data.accountNumber;
        document.getElementById('modal-primary-customer').value = data.primaryCustomerName;
        document.getElementById('modal-account-category').value = data.accountType;
        document.getElementById('modal-account-status').value = data.accountStatus;
        document.getElementById('modal-balance').value = data.balance;

        const indicator = document.getElementById('modal-joint-indicator');
        if (data.joint) {
            indicator.innerHTML = '<span class="joint-indicator-badge joint">Joint Account</span>';
        } else {
            indicator.innerHTML = '<span class="joint-indicator-badge individual">Individual Account</span>';
        }

        const container = document.getElementById('joint-customers-container');
        if (data.jointCustomers && data.jointCustomers.length > 0) {
            container.innerHTML = '<div class="joint-customers-list">' +
                data.jointCustomers.map(jc => `
                    <div class="joint-customer-item">
                        <div class="customer-info">
                            <div class="customer-name">${jc.customerName}</div>
                            <div class="customer-date">Linked: ${jc.linkedDate} at ${jc.linkedTime}</div>
                        </div>
                        <button class="btn-small btn-unlink" onclick="unlinkCustomer('${jc.customerId}')">Unlink</button>
                    </div>
                `).join('') + '</div>';
        } else {
            container.innerHTML = '<div class="empty-state">No joint customers. Add customers below to make it a joint account.</div>';
        }

        const dropdown = document.getElementById('customer-to-link');
        dropdown.innerHTML = '<option value="">Select customer to link...</option>' +
            (data.availableCustomers || []).map(c => `<option value="${c.id}">${c.name} (${c.email})</option>`).join('');
    }

    function saveAccountChanges() {
        const accountId = document.getElementById('modal-account-id').value;
        const formData = new URLSearchParams({
            accountType: document.getElementById('modal-account-category').value,
            accountStatus: document.getElementById('modal-account-status').value,
            balance: document.getElementById('modal-balance').value
        });

        fetch('/account/api/update/' + accountId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showModalNotification('Account updated successfully!', 'success');
                    // Reload after a short delay to show the notification
                    setTimeout(() => {
                        location.reload();
                    }, 1500);
                } else {
                    showModalNotification('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showModalNotification('Failed to update account', 'error');
            });
    }

    function linkCustomer() {
        const customerId = document.getElementById('customer-to-link').value;
        if (!customerId) {
            showModalNotification('Please select a customer', 'error');
            return;
        }

        fetch('/account/api/link-customer/' + currentAccountId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ customerId })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showModalNotification('Customer linked successfully!', 'success');
                    setTimeout(() => {
                        openAccountModal(currentAccountId);
                    }, 1000);
                } else {
                    showModalNotification('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showModalNotification('Failed to link customer', 'error');
            });
    }

    function unlinkCustomer(customerId) {
        if (!confirm('Are you sure you want to unlink this customer?')) return;

        fetch('/account/api/unlink-customer/' + currentAccountId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ customerId })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showModalNotification('Customer unlinked successfully!', 'success');
                    setTimeout(() => {
                        openAccountModal(currentAccountId);
                    }, 1000);
                } else {
                    showModalNotification('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showModalNotification('Failed to unlink customer', 'error');
            });
    }

    document.getElementById('accountModal').addEventListener('click', function(e) {
        if (e.target === this) closeAccountModal();
    });
</script>
</body>
</html>
