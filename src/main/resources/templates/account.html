<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/transactions-layout.css}">
    <link rel="stylesheet" th:href="@{/css/accounts.css}">
    <title>Customer Account Management</title>
</head>
<body>
<div class="main-layout">
    <div class="top-bar">
        <div class="name-card">
            <div th:text="${userName}"></div>
            <div class="position" th:text="${userRole}"></div>
        </div>
        <div class="img-placeholder"> </div>
    </div>

    <div th:replace="~{fragments/navbar2 :: navbar2}"></div>

    <div class="main-content-container">
        <div class="heading-container">
            <h4>Customer Account Management</h4>
            <div>
                <div th:if="${msg}" class="alert alert-info" th:text="${msg}"></div>
            </div>
        </div>

        <div class="search-filter-container">
            <h4>Search Accounts</h4>
            <form th:action="@{/account}" method="get">
                <div class="search-filter-items">
                    <div>
                        <input type="text"
                               id="search"
                               name="search"
                               th:value="${search}"
                               placeholder="Search by customer name or account number...">
                    </div>
                    <div>
                        <button class="btn-style" type="submit">Search</button>
                    </div>
                    <div>
                        <a th:href="@{/account}">
                            <button class="btn-style" type="button">Clear</button>
                        </a>
                    </div>
                </div>
            </form>
        </div>

        <div class="transactions-container">
            <h4>Accounts List</h4>
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Account #</th>
                    <th>Customer Name</th>
                    <th>Email</th>
                    <th>Type</th>
                    <th>Balance (AUD)</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="account : ${accounts}">
                    <td th:text="${account.id}"></td>
                    <td th:text="${account.accountNumber}"></td>
                    <td th:text="${account.customerName}"></td>
                    <td th:text="${account.customerEmail}"></td>
                    <td th:text="${account.accountType}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(account.balance, 1, 2)}"></td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${account.accountStatus == T(com.asd.model.Account.AccountStatus).OPEN} ? 'status-open' :
                                               (${account.accountStatus == T(com.asd.model.Account.AccountStatus).FROZEN} ? 'status-frozen' : 'status-closed')"
                              th:text="${account.accountStatus}">
                        </span>
                    </td>
                    <td class="action-buttons">
                        <!-- Freeze button - show only if account is OPEN -->
                        <form th:if="${account.accountStatus == T(com.asd.model.Account.AccountStatus).OPEN}"
                              th:action="@{/account/freeze/{id}(id=${account.id})}"
                              method="post"
                              style="display:inline;">
                            <button class="btn-action btn-freeze" type="submit">Freeze</button>
                        </form>

                        <!-- ADDED: Unfreeze button - show only if account is FROZEN -->
                        <form th:if="${account.accountStatus == T(com.asd.model.Account.AccountStatus).FROZEN}"
                              th:action="@{/account/unfreeze/{id}(id=${account.id})}"
                              method="post"
                              style="display:inline;">
                            <button class="btn-action btn-unfreeze" type="submit">Unfreeze</button>
                        </form>

                        <!-- Close button - show if account is not already closed -->
                        <form th:if="${account.accountStatus != T(com.asd.model.Account.AccountStatus).CLOSED}"
                              th:action="@{/account/close/{id}(id=${account.id})}"
                              method="post"
                              style="display:inline;">
                            <button class="btn-action btn-close" type="submit">Close</button>
                        </form>

                        <!-- Delete button - show only for admins -->
                        <form th:if="${userRole == 'ADMIN'}"
                              th:action="@{/account/delete/{id}(id=${account.id})}"
                              method="post"
                              style="display:inline;"
                              onsubmit="return confirm('Are you sure you want to delete this account?');">
                            <button class="btn-action btn-delete" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${accounts.isEmpty()}">
                    <td colspan="8" style="text-align:center; color: gray;">No accounts found</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="transactions-container" style="margin-top: 2rem;">
            <h4>Create New Account</h4>
            <form th:action="@{/account/create}" method="post" th:object="${newAccount}">
                <div class="create-account-form">
                    <div class="form-group">
                        <label for="customerId">Customer</label>
                        <select id="customerId" name="customerId" required>
                            <option value="">Select Customer...</option>
                            <option th:each="customer : ${customers}"
                                    th:value="${customer.id}"
                                    th:text="${customer.name + ' (' + customer.email + ')'}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="accountType">Account Type</label>
                        <select id="accountType" name="accountType" required>
                            <option value="">Select Type...</option>
                            <option value="TRANSACTIONAL">Transactional</option>
                            <option value="SAVINGS">Savings</option>
                            <option value="CREDIT">Credit</option>
                            <option value="BUSINESS">Business</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="balance">Initial Balance (AUD)</label>
                        <input type="number"
                               id="balance"
                               name="balance"
                               step="0.01"
                               value="0.00"
                               required>
                    </div>

                    <div class="form-group">
                        <button class="btn-style" type="submit">Create Account</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="footer"></div>
</div>
</body>
</html>
