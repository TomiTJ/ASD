<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Edit Account</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/accounts.css}">
</head>
<body>
<div class="main-layout">
    <div class="top-bar">
        <div class="name-card">
            <div th:text="${userName}"></div>
            <div class="position" th:text="${userRole}"></div>
        </div>
        <div class="img-placeholder"></div>
    </div>

    <div th:replace="fragments/navbar2 :: navbar2"></div>

    <div class="main-content-container">
        <div class="content-header">
            <h2>Edit Account</h2>
            <a class="btn" th:href="@{/accounts}">← Back to Accounts</a>
        </div>

        <div class="card">
            <form th:action="@{/accounts/edit/{id}(id=${account.id})}" th:object="${account}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>ID
                    <input type="text" th:value="*{id}" readonly>
                </label>

                <div class="grid-2">
                    <div>
                        <label>Account #</label>
                        <input type="number" th:field="*{accountNumber}" required
                               th:disabled="${*{accountStatus} == T(com.asd.model.Account.AccountStatus).CLOSED}">
                        <div class="muted" th:if="${*{accountStatus} == T(com.asd.model.Account.AccountStatus).CLOSED}">
                            Closed accounts are locked from number/type changes.
                        </div>
                    </div>

                    <div>
                        <label>Type</label>
                        <select th:field="*{accountType}" required
                                th:disabled="${*{accountStatus} == T(com.asd.model.Account.AccountStatus).CLOSED}">
                            <option th:value="TRANSACTIONAL">TRANSACTIONAL</option>
                            <option th:value="SAVINGS">SAVINGS</option>
                            <option th:value="CREDIT">CREDIT</option>
                            <option th:value="BUSINESS">BUSINESS</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Link to Customer</label>
                        <select th:field="*{userId}" required>
                            <option th:each="c : ${customers}"
                                    th:value="${c.id}"
                                    th:text="${c.fullName + ' (' + c.email + ')'}"></option>
                        </select>
                    </div>
                    <div>
                        <label>Status</label>
                        <select th:field="*{accountStatus}" required>
                            <option th:value="OPEN">OPEN</option>
                            <option th:value="FROZEN">FROZEN</option>
                            <option th:value="CLOSED">CLOSED</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label>Balance (AUD)</label>
                        <input type="number" step="0.01" min="0" th:field="*{balance}" required>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn" type="submit">Update</button>
                    <a class="btn" th:href="@{/accounts}">Cancel</a>

                    <!-- Quick actions -->
                    <button class="btn"
                            th:formaction="@{/accounts/freeze/{id}(id=${account.id})}"
                            formmethod="post"
                            th:disabled="${*{accountStatus} == T(com.asd.model.Account.AccountStatus).FROZEN
                                          or *{accountStatus} == T(com.asd.model.Account.AccountStatus).CLOSED}"
                            onclick="return confirm('Freeze this account?');">
                        Freeze
                    </button>

                    <button class="btn warn"
                            th:formaction="@{/accounts/close/{id}(id=${account.id})}"
                            formmethod="post"
                            th:disabled="${*{accountStatus} == T(com.asd.model.Account.AccountStatus).CLOSED}"
                            onclick="return confirm('Close this account?');">
                        Close
                    </button>

                    <button class="btn warn"
                            th:formaction="@{/accounts/delete/{id}(id=${account.id})}"
                            formmethod="post"
                            onclick="return confirm('Delete this account? This cannot be undone.');">
                        Delete
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer"></div>
</div>
</body>
</html>
