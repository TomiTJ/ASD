<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Audit Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="audit.css">
</head>
<body>
<header class="header">
    <h1>Audit & Reporting — Prototype</h1>
</header>

<main class="container">
    <section class="card">
        <div class="toolbar">
            <form id="filters" onsubmit="return false;">
                <label>
                    Action
                    <select id="filterAction">
                        <option value="">Any</option>
                        <option>CREATE</option>
                        <option>READ</option>
                        <option>UPDATE</option>
                        <option>DELETE</option>
                        <option>APPROVE</option>
                        <option>REJECT</option>
                        <option>RESET_PASSWORD</option>
                    </select>
                </label>
                <label>
                    From
                    <input id="filterFrom" type="date">
                </label>
                <label>
                    To
                    <input id="filterTo" type="date">
                </label>
                <button id="applyBtn" type="button">Apply</button>
                <button id="resetBtn" type="button" class="ghost">Reset</button>
            </form>
        </div>

        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>When</th>
                    <th>Action</th>
                    <th>Actor</th>
                    <th>Resource</th>
                    <th>Request ID</th>
                    <th>Audit ID</th>
                </tr>
                </thead>
                <tbody id="auditRows">

                </tbody>
            </table>
            <div id="emptyState" class="empty" hidden>No audit events yet. Trigger an action to generate logs.</div>
        </div>

        <footer class="footer">
            <div id="totalLabel">Total: 0</div>
        </footer>
    </section>
</main>

<script>
    const rowsEl = document.getElementById('auditRows');
    const emptyEl = document.getElementById('emptyState');
    const totalEl = document.getElementById('totalLabel');
    const applyBtn = document.getElementById('applyBtn');
    const resetBtn = document.getElementById('resetBtn');

    function fmt(d) {
        try {
            const dt = new Date(d);
            if (!isNaN(dt.getTime())) return dt.toISOString().replace('T',' ').slice(0,19);
        } catch(_){}
        return d || '';
    }

    async function loadAudits(params={}) {
        const q = new URLSearchParams();
        if (params.action) q.set('action', params.action);
        if (params.from) q.set('from', params.from);
        if (params.to) q.set('to', params.to);

        let data = [];
        try {
            const res = await fetch('/api/audits' + (q.toString()? ('?'+q.toString()) : ''));
            if (res.ok) data = await res.json();
        } catch (e) {
            if (Array.isArray(window.__AUDITS__)) data = window.__AUDITS__;
        }

        rowsEl.innerHTML = '';
        if (!data || data.length === 0) {
            emptyEl.hidden = false;
            totalEl.textContent = 'Total: 0';
            return;
        }
        emptyEl.hidden = true;
        totalEl.textContent = 'Total: ' + data.length;

        const frag = document.createDocumentFragment();
        data.forEach(a => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
          <td>${fmt(a.createdAt)}</td>
          <td><span class="tag">${a.action || ''}</span></td>
          <td class="mono">${a.actorUserId || ''}</td>
          <td>
            <div class="mono">${(a.resourceType||'') + ' / ' + (a.resourceId||'')}</div>
            ${a.resourceDisplay ? `<small class="muted mono">${a.resourceDisplay}</small>` : ''}
          </td>
          <td class="mono">${a.requestId || ''}</td>
          <td class="mono">${a.auditEventId || ''}</td>`;
            frag.appendChild(tr);
        });
        rowsEl.appendChild(frag);
    }

    applyBtn?.addEventListener('click', () => {
        const action = document.getElementById('filterAction').value;
        const from = document.getElementById('filterFrom').value;
        const to = document.getElementById('filterTo').value;
        loadAudits({ action, from, to });
    });

    resetBtn?.addEventListener('click', () => {
        document.getElementById('filterAction').value = '';
        document.getElementById('filterFrom').value = '';
        document.getElementById('filterTo').value = '';
        loadAudits();
    });

    loadAudits();
</script>
</body>
</html>
