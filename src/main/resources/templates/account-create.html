<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Create Account</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/accounts.css}">
</head>
<body>
<div class="main-layout">
    <div class="top-bar">
        <div class="name-card">
            <div th:text="${userName}"></div>
            <div class="position" th:text="${userRole}"></div>
        </div>
        <div class="img-placeholder"></div>
    </div>

    <div th:replace="fragments/navbar2 :: navbar2"></div>

    <div class="main-content-container">
        <div class="content-header">
            <h2>Create Account</h2>
            <a class="btn" th:href="@{/accounts}">← Back to Accounts</a>
        </div>

        <div class="card">
            <form th:action="@{/accounts/create}" th:object="${account}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Link to Customer
                    <select th:field="*{userId}" required>
                        <option value="" disabled selected>— Select customer —</option>
                        <option th:each="c : ${customers}"
                                th:value="${c.id}"
                                th:text="${c.fullName + ' (' + c.email + ')'}"></option>
                    </select>
                </label>

                <label>Account #</label>
                <input type="number" th:field="*{accountNumber}" required placeholder="e.g. 1000456789">

                <div class="grid-2">
                    <div>
                        <label>Type</label>
                        <select th:field="*{accountType}" required>
                            <option th:value="TRANSACTIONAL">TRANSACTIONAL</option>
                            <option th:value="SAVINGS">SAVINGS</option>
                            <option th:value="CREDIT">CREDIT</option>
                            <option th:value="BUSINESS">BUSINESS</option>
                        </select>
                    </div>
                    <div>
                        <label>Status</label>
                        <select th:field="*{accountStatus}" required>
                            <option th:value="OPEN">OPEN</option>
                            <option th:value="FROZEN">FROZEN</option>
                            <option th:value="CLOSED">CLOSED</option>
                        </select>
                    </div>
                </div>

                <label>Initial Balance (AUD)</label>
                <input type="number" step="0.01" min="0" th:field="*{balance}" value="0.00" required>

                <div class="actions">
                    <button class="btn" type="submit">Create</button>
                    <a class="btn" th:href="@{/accounts}">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <div class="footer"></div>
</div>
</body>
</html>
