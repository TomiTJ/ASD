<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Edit User</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h2>Edit User</h2>

<form th:action="@{/users/edit/{id}(id=${user.id})}" th:object="${user}" method="post">
    <label>Full Name</label>
    <input type="text" th:field="*{fullName}" required>

    <label>Email</label>
    <input type="email" th:field="*{email}" required>

    <label>Password</label>
    <input type="password" th:field="*{password}" required>

    <label>Role</label>
    <select th:field="*{role}">
        <option th:value="ADMIN">ADMIN</option>
        <option th:value="READ_ONLY">READ_ONLY</option>
    </select>

    <label>Status</label>
    <select th:field="*{status}">
        <option th:value="ACTIVE">ACTIVE</option>
        <option th:value="DEACTIVATED">DEACTIVATED</option>
    </select>

    <button type="submit">Update</button>
</form>

</body>
</html>
