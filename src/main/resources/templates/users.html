<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/users.css}">
</head>
<body>
<div class="main-layout">
    <div class="top-bar">
        <span class="top-bar-title">Users</span>
        <div class="top-bar-right">
            <div class="name-card">
                <div th:text="${userName}"></div>
                <div class="position" th:text="${userRole}"></div>
            </div>
            <div class="user-avatar-circle" th:text="${#strings.substring(userName, 0, 2)}">AU</div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar2 :: navbar2}"></div>

    <div class="main-content-container">
        <!-- Flash Messages -->
        <div th:if="${msg}" class="alert alert-success">
            <span>✓</span>
            <span th:text="${msg}"></span>
        </div>

        <!-- Page Header -->
        <div class="page-header">
            <h2>User Management</h2>
            <div style="display: flex; gap: 0.75rem;">
                <button class="btn btn-secondary" onclick="exportToCSV()">
                    📥 Export CSV
                </button>
                <a class="btn btn-primary" th:href="@{/users/create}">
                    + Create New User
                </a>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-label">Total Users</div>
                <div class="stat-value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Active Users</div>
                <div class="stat-value" id="activeUsers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Administrators</div>
                <div class="stat-value" id="adminUsers">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Read-Only Users</div>
                <div class="stat-value" id="readOnlyUsers">0</div>
            </div>
        </div>

        <!-- Filters and Search -->
        <div class="filters-section">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search users by name, email, or role..."
                    onkeyup="applyFilters()">
            </div>
            
            <div class="filter-controls">
                <div class="filter-group">
                    <label for="roleFilter">Role:</label>
                    <select id="roleFilter" onchange="applyFilters()">
                        <option value="all">All Roles</option>
                        <option value="ADMIN">Admin</option>
                        <option value="READ_ONLY">Read Only</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="statusFilter">Status:</label>
                    <select id="statusFilter" onchange="applyFilters()">
                        <option value="all">All Status</option>
                        <option value="ACTIVE">Active</option>
                        <option value="DEACTIVATED">Deactivated</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="sortBy">Sort By:</label>
                    <select id="sortBy" onchange="sortUsers()">
                        <option value="name">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="email">Email (A-Z)</option>
                        <option value="email-desc">Email (Z-A)</option>
                        <option value="role">Role</option>
                        <option value="status">Status</option>
                    </select>
                </div>

                <button class="btn btn-secondary btn-small" onclick="resetFilters()" style="margin-top: 1.4rem;">
                    Reset
                </button>
            </div>
        </div>

        <!-- Users Grid -->
        <div class="users-grid" id="usersGrid">
            <div th:each="u : ${users}" 
                 class="user-card"
                 th:classappend="${u.id == currentUserId ? 'current-user' : ''}"
                 th:attr="data-id=${u.id}, data-name=${u.fullName}, data-email=${u.email}, data-role=${u.role}, data-status=${u.status}">
                
                <!-- Avatar -->
                <div class="user-avatar" th:text="${#strings.substring(u.fullName, 0, 2)}">
                    AB
                </div>

                <!-- User Info -->
                <div class="user-info">
                    <h3 class="user-name" th:text="${u.fullName}">Full Name</h3>
                    <div class="user-email" th:text="${u.email}">email@example.com</div>
                    <div class="user-meta">
                        <span class="badge badge-role" 
                              th:classappend="${u.role.name() == 'ADMIN' ? 'admin' : ''}"
                              th:text="${u.role}">
                            ROLE
                        </span>
                        <span class="badge badge-status" 
                              th:classappend="${u.status.name() == 'DEACTIVATED' or u.status.name() == 'INACTIVE' ? 'deactivated' : ''}"
                              th:text="${u.status}">
                            STATUS
                        </span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="user-actions">
                    <a class="btn btn-secondary btn-small" 
                       th:href="@{/users/edit/{id}(id=${u.id})}"
                       title="Edit this user">
                        ✏️ Edit
                    </a>
                    <form th:action="@{/users/delete/{id}(id=${u.id})}" 
                          method="post" 
                          style="margin: 0;"
                          onsubmit="return confirm('Are you sure you want to deactivate this user?');">
                        <button type="submit" 
                                class="btn btn-danger btn-small" 
                                th:disabled="${u.id == currentUserId}"
                                title="Deactivate this user">
                            🗑️ Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div style="font-size: 4rem; opacity: 0.3;">🔍</div>
            <p>No users found matching your filters.</p>
        </div>
    </div>

    <div class="footer"></div>
</div>

<script>
    let allUserCards = [];

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', function() {
        allUserCards = Array.from(document.querySelectorAll('.user-card'));
        calculateStats();
    });

    // Calculate stats from user cards
    function calculateStats() {
        const visibleCards = allUserCards.filter(card => card.style.display !== 'none');
        let total = visibleCards.length;
        let active = 0;
        let admins = 0;
        let readOnly = 0;

        visibleCards.forEach(card => {
            const status = card.getAttribute('data-status');
            const role = card.getAttribute('data-role');

            if (status === 'ACTIVE') active++;
            if (role === 'ADMIN') admins++;
            if (role === 'READ_ONLY') readOnly++;
        });

        document.getElementById('totalUsers').textContent = total;
        document.getElementById('activeUsers').textContent = active;
        document.getElementById('adminUsers').textContent = admins;
        document.getElementById('readOnlyUsers').textContent = readOnly;
    }

    // Apply all filters
    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const roleFilter = document.getElementById('roleFilter').value;
        const statusFilter = document.getElementById('statusFilter').value;
        const emptyState = document.getElementById('emptyState');
        let visibleCount = 0;

        allUserCards.forEach(card => {
            const name = card.getAttribute('data-name').toLowerCase();
            const email = card.getAttribute('data-email').toLowerCase();
            const role = card.getAttribute('data-role');
            const status = card.getAttribute('data-status');

            const matchesSearch = name.includes(searchTerm) || 
                                 email.includes(searchTerm) || 
                                 role.toLowerCase().includes(searchTerm);
            
            const matchesRole = roleFilter === 'all' || role === roleFilter;
            const matchesStatus = statusFilter === 'all' || status === statusFilter;

            if (matchesSearch && matchesRole && matchesStatus) {
                card.style.display = '';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        emptyState.style.display = visibleCount === 0 ? 'block' : 'none';
        calculateStats();
    }

    // Sort users
    function sortUsers() {
        const sortBy = document.getElementById('sortBy').value;
        const grid = document.getElementById('usersGrid');

        allUserCards.sort((a, b) => {
            let aVal, bVal;

            switch(sortBy) {
                case 'name':
                    aVal = a.getAttribute('data-name').toLowerCase();
                    bVal = b.getAttribute('data-name').toLowerCase();
                    return aVal.localeCompare(bVal);
                
                case 'name-desc':
                    aVal = a.getAttribute('data-name').toLowerCase();
                    bVal = b.getAttribute('data-name').toLowerCase();
                    return bVal.localeCompare(aVal);
                
                case 'email':
                    aVal = a.getAttribute('data-email').toLowerCase();
                    bVal = b.getAttribute('data-email').toLowerCase();
                    return aVal.localeCompare(bVal);
                
                case 'email-desc':
                    aVal = a.getAttribute('data-email').toLowerCase();
                    bVal = b.getAttribute('data-email').toLowerCase();
                    return bVal.localeCompare(aVal);
                
                case 'role':
                    aVal = a.getAttribute('data-role');
                    bVal = b.getAttribute('data-role');
                    return aVal.localeCompare(bVal);
                
                case 'status':
                    aVal = a.getAttribute('data-status');
                    bVal = b.getAttribute('data-status');
                    return aVal.localeCompare(bVal);
                
                default:
                    return 0;
            }
        });

        // Re-append cards in sorted order
        allUserCards.forEach(card => grid.appendChild(card));
    }

    // Reset all filters
    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('roleFilter').value = 'all';
        document.getElementById('statusFilter').value = 'all';
        document.getElementById('sortBy').value = 'name';
        sortUsers();
        applyFilters();
    }

    // Export to CSV
    function exportToCSV() {
        const visibleCards = allUserCards.filter(card => card.style.display !== 'none');
        
        if (visibleCards.length === 0) {
            alert('No users to export!');
            return;
        }

        // CSV Header
        let csv = 'ID,Full Name,Email,Role,Status\n';

        // CSV Rows
        visibleCards.forEach(card => {
            const id = card.getAttribute('data-id');
            const name = card.getAttribute('data-name');
            const email = card.getAttribute('data-email');
            const role = card.getAttribute('data-role');
            const status = card.getAttribute('data-status');

            // Escape quotes and commas
            const escapedName = `"${name.replace(/"/g, '""')}"`;
            const escapedEmail = `"${email.replace(/"/g, '""')}"`;

            csv += `${id},${escapedName},${escapedEmail},${role},${status}\n`;
        });

        // Create download
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        link.setAttribute('href', url);
        link.setAttribute('download', `users_export_${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Search input visual feedback
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const searchTerm = e.target.value;
        if (searchTerm.length > 0) {
            document.getElementById('usersGrid').style.opacity = '0.95';
        } else {
            document.getElementById('usersGrid').style.opacity = '1';
        }
    });
</script>
</body>
</html>
