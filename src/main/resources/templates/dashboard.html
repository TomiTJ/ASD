<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — Bank Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .metric-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .metric-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px 24px;
            border: 1px solid #e5e7eb;
        }
        .metric-card .label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .metric-card .value {
            font-size: 1.9rem;
            font-weight: 700;
            color: #111827;
            min-height: 2.2rem;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e5e7eb;
        }
        .chart-card h3 {
            margin: 0 0 16px;
            font-size: 0.75rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .chart-card canvas { max-height: 240px; }
        .page-heading {
            font-size: 1.4rem;
            font-weight: 700;
            color: #111827;
            margin: 0 0 24px;
        }
    </style>
</head>
<body>
<div class="main-layout">
    <div class="top-bar">
        <span class="top-bar-title">Dashboard</span>
        <div class="top-bar-right">
            <div class="name-card">
                <div th:text="${userName}"></div>
                <div class="position" th:text="${userRole}"></div>
            </div>
            <div class="user-avatar-circle" th:text="${#strings.substring(userName, 0, 2)}">AU</div>
        </div>
    </div>

    <div th:replace="~{fragments/navbar2 :: navbar2}"></div>

    <div class="main-content-container">

        <!-- Metric Cards -->
        <div class="metric-cards">
            <div class="metric-card">
                <div class="label">Total Users</div>
                <div class="value skeleton" id="totalUsers">0</div>
            </div>
            <div class="metric-card">
                <div class="label">Total Accounts</div>
                <div class="value skeleton" id="totalAccounts">0</div>
            </div>
            <div class="metric-card">
                <div class="label">Total Transactions</div>
                <div class="value skeleton" id="totalTransactions">0</div>
            </div>
            <div class="metric-card">
                <div class="label">Assets Under Management</div>
                <div class="value skeleton" id="totalBalance">$0.00</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>Transaction Status</h3>
                <canvas id="txStatusChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Transaction Types</h3>
                <canvas id="txTypeChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Account Types</h3>
                <canvas id="accountTypeChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Account Status</h3>
                <canvas id="accountStatusChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>Loan Pipeline</h3>
                <canvas id="loanChart"></canvas>
            </div>
        </div>
    </div>
    <div class="footer"></div>
</div>

<script th:src="@{/dashboard.js}"></script>
</body>
</html>
