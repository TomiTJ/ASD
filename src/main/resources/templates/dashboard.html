<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" th:href="@{css/main.css}">
    <title>Dashboard</title>
</head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<body>
<div class="main-layout">
    <div class="top-bar">
        <div class="name-card">
            <div th:text="${userName}"></div>
            <div class="position" th:text="${userRole}"></div>
        </div>
        <div class="img-placeholder"></div>
    </div>
    <div th:replace="fragments/navbar2 :: navbar2"></div>
    <div class="main-content-container">
        <div>
            <h2>Welcome, <span th:text="${userName}">User</span>!</h2>
            <p>Your role: <strong th:text="${userRole}">VIEWER</strong></p>
            <hr>
            <div class="metrics">
                <p>Total Users: <span id ="totalUsers">Loading...</span></p>
                <p>Total Accounts: <span id ="totalAccounts">Loading...</span></p>
                <p>Total Transactions: <span id ="totalTransactions">Loading...</span></p>
            </div>
            <div style="max-width: 1200px; margin: 16px auto;">
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;">
                    <div class="card" style="padding:12px;">
                        <h3 style="margin:0 0 8px;">Transactions (Weekly Data)</h3>
                        <canvas id="transactionsChart"></canvas>
                    </div>
                    <div class="card" style="padding:12px;">
                        <h3 style="margin:0 0 8px;">Users(Weekly Data)</h3>
                        <canvas id="usersChart"></canvas>
                    </div>
                    <div class="card" style="padding:12px;">
                        <h3 style="margin:0 0 8px;">Customers(Weekly Data)</h3>
                        <canvas id="accountsChart"></canvas>
                    </div>
                </div>
            </div>


            <script src="dashboard.js"></script>
            <div>
                <span>
                    Welcome, <b th:text="${userName}"></b>(<span th:text="${userRole}"></span>)
                </span>
                <form method="post" th:action="@{/logout}" style="display:inline">
                    <button type="submit">Logout</button>
                </form>
            </div>
        </div>
    </div>
    <div class="footer"></div>
</div>



</body>
</html>
