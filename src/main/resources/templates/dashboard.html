<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — Bank Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .metric-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .metric-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }
        .metric-card .label {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .metric-card .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a1a2e;
        }
        .metric-card .icon {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .chart-card h3 {
            margin: 0 0 16px;
            font-size: 0.95rem;
            color: #444;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .chart-card canvas {
            max-height: 240px;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .dashboard-header h2 { margin: 0; }
    </style>
</head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<body>
<div class="main-layout">
    <div class="top-bar">
        <div class="name-card">
            <div th:text="${userName}"></div>
            <div class="position" th:text="${userRole}"></div>
        </div>
        <div class="user-avatar-circle" th:text="${#strings.substring(userName, 0, 2)}">AU</div>
    </div>
    <div th:replace="~{fragments/navbar2 :: navbar2}"></div>
    <div class="main-content-container">

        <div class="dashboard-header">
            <h2>Dashboard</h2>
            <div>
                <span>Welcome, <b th:text="${userName}"></b></span>
                <form method="post" th:action="@{/logout}" style="display:inline; margin-left:12px;">
                    <button type="submit">Logout</button>
                </form>
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="metric-cards">
            <div class="metric-card">
                <div class="icon">👥</div>
                <div class="label">Total Users</div>
                <div class="value" id="totalUsers">—</div>
            </div>
            <div class="metric-card">
                <div class="icon">🏦</div>
                <div class="label">Total Accounts</div>
                <div class="value" id="totalAccounts">—</div>
            </div>
            <div class="metric-card">
                <div class="icon">💳</div>
                <div class="label">Total Transactions</div>
                <div class="value" id="totalTransactions">—</div>
            </div>
            <div class="metric-card">
                <div class="icon">💰</div>
                <div class="label">Assets Under Management</div>
                <div class="value" id="totalBalance">—</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-grid">

            <div class="chart-card">
                <h3>Transaction Status</h3>
                <canvas id="txStatusChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>Transaction Types</h3>
                <canvas id="txTypeChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>Account Types</h3>
                <canvas id="accountTypeChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>Account Status</h3>
                <canvas id="accountStatusChart"></canvas>
            </div>

            <div class="chart-card">
                <h3>Loan Pipeline</h3>
                <canvas id="loanChart"></canvas>
            </div>

        </div>
    </div>
    <div class="footer"></div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
