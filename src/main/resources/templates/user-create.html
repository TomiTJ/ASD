<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create New User</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/users.css}">
</head>
<body>
<div class="main-layout">
    <div class="top-bar">
        <div class="name-card">
            <div th:text="${userName}"></div>
            <div class="position" th:text="${userRole}"></div>
        </div>
        <div class="img-placeholder"></div>
    </div>

    <div th:replace="fragments/navbar2 :: navbar2"></div>

    <div class="main-content-container">
        <!-- Page Header -->
        <div class="page-header">
            <h2>Create New User</h2>
            <a class="btn btn-secondary" th:href="@{/users}">
                ← Back to Users
            </a>
        </div>

        <!-- Form Container -->
        <div class="form-container">
            <div class="form-card">
                <form th:action="@{/users/create}" th:object="${user}" method="post">
                    
                    <div class="form-group">
                        <label for="fullName">Full Name *</label>
                        <input 
                            type="text" 
                            id="fullName" 
                            th:field="*{fullName}" 
                            placeholder="Enter full name"
                            required
                            autofocus>
                        <div class="form-help">The user's complete name</div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input 
                            type="email" 
                            id="email" 
                            th:field="*{email}" 
                            placeholder="user@example.com"
                            required>
                        <div class="form-help">This will be used for login</div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password *</label>
                        <input 
                            type="password" 
                            id="password" 
                            th:field="*{password}" 
                            placeholder="Enter secure password"
                            required
                            minlength="6">
                        <div class="form-help">Minimum 6 characters required</div>
                    </div>

                    <div class="form-group">
                        <label for="role">User Role *</label>
                        <select id="role" th:field="*{role}" required>
                            <option value="">Select a role</option>
                            <option th:value="ADMIN">Administrator - Full access to all features</option>
                            <option th:value="READ_ONLY">Read Only - View-only access</option>
                        </select>
                        <div class="form-help">Determines what the user can access</div>
                    </div>

                    <div class="form-group">
                        <label for="status">Account Status *</label>
                        <select id="status" th:field="*{status}" required>
                            <option value="">Select status</option>
                            <option th:value="ACTIVE" selected>Active - User can login</option>
                            <option th:value="DEACTIVATED">Deactivated - User cannot login</option>
                        </select>
                        <div class="form-help">Active users can access the system</div>
                    </div>

                    <div class="form-actions">
                        <a class="btn btn-secondary" th:href="@{/users}">Cancel</a>
                        <button class="btn btn-primary" type="submit">
                            ✓ Create User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="footer"></div>
</div>

<script>
    // Form validation feedback
    const form = document.querySelector('form');
    const inputs = form.querySelectorAll('input[required], select[required]');
    
    inputs.forEach(input => {
        input.addEventListener('invalid', function(e) {
            e.preventDefault();
            this.style.borderColor = '#c62828';
        });
        
        input.addEventListener('input', function() {
            this.style.borderColor = '#e0e0e0';
        });
    });

    // Password strength indicator
    const passwordInput = document.getElementById('password');
    passwordInput.addEventListener('input', function() {
        const strength = this.value.length;
        if (strength < 6) {
            this.style.borderColor = '#c62828';
        } else if (strength < 10) {
            this.style.borderColor = '#ff9800';
        } else {
            this.style.borderColor = '#4caf50';
        }
    });
</script>
</body>
</html>
