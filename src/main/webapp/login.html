<!doctype html>
<html>
    <head><meta charset="utf-8"><title>Bank Admin — Login</title></head>
    <body>
        <h2>Bank Admin — Login</h2>
        <form method="post" action="/login">
            <label>Email</label><br/>
            <input type="text" name="username" autocomplete="username"><br/><br/>
            <label>Password</label><br/>
            <input type="password" name="password" autocomplete="current-password"><br/><br/>
            <button type="submit">Sign in</button>
        </form>

        <p id="msg" style="color:red; display:none;">Invalid credentials</p>

        <script>
            const p = new URLSearchParams(location.search);
            if (p.has('error')) document.getElementById('msg').style.display='block';
        </script>
</body>
</html>
