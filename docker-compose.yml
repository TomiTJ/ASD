services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankdatabase
      POSTGRES_USER: bankadmin
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankadmin -d bankdatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "80:8080"
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bankdatabase
      DB_USERNAME: bankadmin
      DB_PASSWORD: 123
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
