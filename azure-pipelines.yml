# Starter pipeline
trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  # 🔧 Fill these in (or set as pipeline variables)
  AZ_SUB_CONN: 'Azure subscription 1(22c01a58-733d-405e-8882-0da91e1f052d)'
  APP_SERVICE_NAME: 'bankapp-dev'
  RESOURCE_GROUP: 'rg-bankapp'
  ARTIFACT_NAME: 'drop'
  RUNTIME: 'JAVA|17'

# 🔧 Service container for PostgreSQL (used during tests)
services:
  postgres:
    image: postgres:14
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankdb_test
    ports:
      - 5432:5432
    options: >-
      --health-cmd="pg_isready -U postgres"
      --health-interval=10s
      --health-timeout=5s
      --health-retries=5

steps:
- task: JavaToolInstaller@1
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: java -version
  displayName: 'Check Java version'

# ✅ Run tests against Postgres test container
- task: Maven@4
  displayName: 'Maven clean test (Postgres test DB)'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean test -B'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false
  env:
    SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bankdb_test
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres

# 📦 Build JAR (skip tests, use test profile to avoid prod DB connection)
- task: Maven@4
  displayName: 'Maven package (skip tests)'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'package -DskipTests -B -Dspring.profiles.active=test'
    javaHomeOption: 'JDKVersion'
    mavenVersionOption: 'Default'
  env:
    SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bankdb_test
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres

# ⬆️ Publish the JAR as a pipeline artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish JAR artifact'
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/target/*.jar'
    ArtifactName: '$(ARTIFACT_NAME)'
    publishLocation: 'Container'

# ⚙️ Configure App Service runtime & settings
- task: AzureCLI@2
  displayName: 'Configure App Service runtime & settings'
  inputs:
    azureSubscription: '$(AZ_SUB_CONN)'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      az webapp config set -g "$(RESOURCE_GROUP)" -n "$(APP_SERVICE_NAME)" --linux-fx-version "$(RUNTIME)"
      
      az webapp config appsettings set -g "$(RESOURCE_GROUP)" -n "$(APP_SERVICE_NAME)" --settings \
        SPRING_PROFILES_ACTIVE=dev \
        WEBSITES_PORT=8080 \
        SPRING_DATASOURCE_URL="$(SPRING_DATASOURCE_URL)" \
        SPRING_DATASOURCE_USERNAME="$(SPRING_DATASOURCE_USERNAME)" \
        SPRING_DATASOURCE_PASSWORD="$(SPRING_DATASOURCE_PASSWORD)"

# 🚀 Deploy JAR to Azure App Service (Linux)
- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: '$(AZ_SUB_CONN)'
    appType: webAppLinux
    appName: '$(APP_SERVICE_NAME)'
    package: '$(System.DefaultWorkingDirectory)/target/*.jar'

# 🩺 Basic health check
- script: |
    URL="https://$(APP_SERVICE_NAME).azurewebsites.net/actuator/health"
    echo "Checking $URL"
    for i in {1..20}; do
      code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
      if [ "$code" = "200" ]; then
        echo "Healthy ✅"
        exit 0
      fi
      echo "Waiting...($i) got $code"; sleep 10
    done
    echo "Health check failed ❌"; exit 1
  displayName: 'Health check'