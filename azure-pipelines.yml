trigger:
  - master

pool:
  vmImage: ubuntu-latest

steps:
  # Step 1 – Check out the code
  - task: Checkout@1
    displayName: 'Checkout source code'

  # Step 2 – Set up JDK 21 (Temurin or Oracle, whichever you want)
  - task: UseJavaVersion@1
    inputs:
      versionSpec: '21'
      distribution: 'temurin'
    displayName: 'Set up Java 21'

  # Step 3 – Cache Maven dependencies for faster builds
  - task: Cache@2
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      path: ~/.m2/repository
      restoreKeys: |
        maven | "$(Agent.OS)"
    displayName: 'Cache Maven packages'

  # Step 4 – Build & run tests
  - script: mvn clean install -B
    displayName: 'Build with Maven and run unit tests'

  # Step 5 – Publish JUnit test results to Azure DevOps
  - task: PublishTestResults@2
    inputs:
      testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
      testRunTitle: 'JUnit Test Results'
    condition: succeededOrFailed()
    displayName: 'Publish JUnit test results'