trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- task: JavaToolInstaller@1
  inputs:
    versionSpec: '21'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: java -version
  displayName: 'Check Java version'

- task: Maven@4
  displayName: 'Build & Test'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package'
    mavenOptions: '-Xmx3072m -B'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.21'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

- script: |
    echo "PWD: $(System.DefaultWorkingDirectory)"
    find $(System.DefaultWorkingDirectory) -type f -name '*.jar' -maxdepth 5 -print
  displayName: 'Locate built JARs'

- task: PublishBuildArtifacts@1
  displayName: 'Publish JAR(s)'
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/**/target/*.jar'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  condition: succeeded()