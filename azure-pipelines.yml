trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- script: echo Checking dependencies
  displayName: 'Running check'


- script: echo Finish check
  displayName: 'Successful check'

- script: echo Testing Features
  displayName: 'Testing Features...'

- script: echo Feature success
  displayName: 'SUCCESS'


- script: |
    echo Add other tasks to build, test, and deploy your project.
    echo See https://aka.ms/yaml
  displayName: 'Run a multi-line script'