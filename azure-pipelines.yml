trigger:
- master

pool:
  vmImage: ubuntu-latest

services:
  postgres:
    image: postgres:14
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bankdb_test
    ports:
      - 5432:5432

steps:
- task: JavaToolInstaller@1
  displayName: 'Install JDK 21'
  inputs:
    versionSpec: '21'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: |
    sudo apt-get update
    sudo apt-get install -y maven
  displayName: 'Install Maven'

- script: |
    java -version
    mvn -version
  displayName: 'Show tool versions'

- task: Maven@4
  displayName: 'Build & Test'
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package'
    mavenOptions: '-Xmx3072m -B'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.21'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'

- script: |
    echo "Scanning for built jars under $(System.DefaultWorkingDirectory)"
    find "$(System.DefaultWorkingDirectory)" -type f -name '*.jar' -maxdepth 6 -print
  displayName: 'Locate built JARs'

- task: PublishBuildArtifacts@1
  displayName: 'Publish JAR(s)'
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/**/target/*.jar'
    ArtifactName: 'drop'
    publishLocation: 'Container'
  condition: succeeded()