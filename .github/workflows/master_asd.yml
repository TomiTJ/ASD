trigger:
  - master

variables:
  # Azure service connection name (Project Settings → Service connections)
  AZ_SUB_CONN: 'YOUR-AZURE-SVC-CONN'
  RESOURCE_GROUP: 'rg-bankapp'
  APP_SERVICE_NAME: 'bankapp-dev'    # your App Service (Linux) name
  RUNTIME: 'JAVA|21'                  # Java SE 21 on Linux
  ARTIFACT_NAME: 'drop'

stages:
  - stage: Build
    displayName: Build & Publish JAR
    jobs:
      - job: build
        pool: { vmImage: 'ubuntu-latest' }
        steps:
          - task: JavaToolInstaller@1
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - script: |
              sudo apt-get update
              sudo apt-get install -y maven
              mvn -v
            displayName: Install Maven

          - task: Maven@4
            displayName: Maven package
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package -B'
              mavenOptions: '-Xmx3072m'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'

          - task: PublishBuildArtifacts@1
            displayName: Publish artifact
            inputs:
              PathtoPublish: '$(System.DefaultWorkingDirectory)/**/target/*.jar'
              ArtifactName: '$(ARTIFACT_NAME)'

  - stage: Deploy
    displayName: Deploy to Azure App Service
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: web
        environment: 'bankapp-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: $(ARTIFACT_NAME)

                - task: AzureCLI@2
                  displayName: Configure runtime & app settings
                  inputs:
                    azureSubscription: '$(AZ_SUB_CONN)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      APP=$(APP_SERVICE_NAME)
                      RG=$(RESOURCE_GROUP)
                      
                      # Set Java 21 runtime
                      az webapp config set -g "$RG" -n "$APP" --linux-fx-version "$(RUNTIME)"
                      
                      # Spring profile + DB connection (use variable group or KeyVault in real pipelines)
                      az webapp config appsettings set -g "$RG" -n "$APP" --settings \
                        SPRING_PROFILES_ACTIVE=dev \
                        SPRING_DATASOURCE_URL="$(SPRING_DATASOURCE_URL)" \
                        SPRING_DATASOURCE_USERNAME="$(SPRING_DATASOURCE_USERNAME)" \
                        SPRING_DATASOURCE_PASSWORD="$(SPRING_DATASOURCE_PASSWORD)" \
                        WEBSITES_PORT=8080

                - task: AzureWebApp@1
                  displayName: Deploy JAR to App Service
                  inputs:
                    azureSubscription: '$(AZ_SUB_CONN)'
                    appType: webAppLinux
                    appName: '$(APP_SERVICE_NAME)'
                    package: '$(Pipeline.Workspace)/$(ARTIFACT_NAME)/**/*.jar'

                - bash: |
                    URL="https://$(APP_SERVICE_NAME).azurewebsites.net/actuator/health"
                    echo "Checking $URL"
                    for i in {1..20}; do
                      code=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
                      [ "$code" = "200" ] && echo "Healthy" && exit 0
                      echo "Waiting...($i) got $code"; sleep 10
                    done
                    echo "Health check failed"; exit 1
                  displayName: Health check